[project]
name = "apiverve-tickernews"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Ticker News is a stock news API that returns the latest news stories about one ticker symbol: US stocks and ETFs, stocks on 18 international markets, cryptocurrencies, futures and currency pairs. Each story comes with its headline, link, source, publisher and publication time, and is tagged as directly about the company or as a related market story. Paid plans add story summaries, headline tone and more stories per call."
keywords = ["stock news api", "stock market news api", "free stock news api", "financial news api", "finance news api"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/tickernews?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/tickernews?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/tickernews-api"
Twitter = "https://twitter.com/apivervehq"
